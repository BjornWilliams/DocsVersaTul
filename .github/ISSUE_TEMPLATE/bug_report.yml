name: Bug report
description: Report unexpected behavior in a VersaTul package.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        This creates a public issue. Do not include credentials, personal data, private production data, or vulnerability details.
        For security concerns, follow the private-channel guidance at https://docsversatul.readthedocs.io/en/latest/security.html.
  - type: input
    id: package
    attributes:
      label: NuGet package
      description: Which VersaTul package is affected?
      placeholder: VersaTul.Data.Sql
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: target-framework
    attributes:
      label: Target framework
      options:
        - .NET 8
        - .NET 9
        - .NET 10
        - Other
        - Not sure
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the exact exception or result, with sensitive values removed.
      placeholder: Describe the behavior you observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Add the smallest relevant code/configuration example and steps to reproduce.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact tokens, credentials, personal information, and production data.
      render: text
