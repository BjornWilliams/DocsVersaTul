name: Documentation samples

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  samples:
    name: Build, run, and check sample output
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation
        uses: actions/checkout@v7

      - name: Set up directly supported .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Validate documentation snippet inventory
        shell: pwsh
        run: ./docs/scripts/Test-DocumentationSnippetInventory.ps1 -RequirePseudocodeCaptions

      - name: Set up Python for strict Sphinx validation
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install documentation requirements
        run: python -m pip install -r requirements.txt
        working-directory: docs

      - name: Build documentation with warnings as errors
        id: sphinx_build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          python -m sphinx -n -W --keep-going -b html source build/html 2>&1 | tee build/sphinx-html-build.log
        working-directory: docs

      - name: Archive the strict Sphinx log on failure
        if: failure() && steps.sphinx_build.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sphinx-html-build-log
          path: docs/build/sphinx-html-build.log
          if-no-files-found: error
          retention-days: 14

      - name: Validate published-package samples
        shell: pwsh
        run: ./docs/samples/Invoke-PublishedSampleValidation.ps1

  external-links:
    name: Check external documentation links
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation
        uses: actions/checkout@v7

      - name: Check external links with retries
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --root-dir "$(pwd)" --config lychee.toml --verbose --no-progress './README.rst' './docs/source/**/*.rst'
          lycheeVersion: v0.24.2
